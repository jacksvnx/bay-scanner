name: Bay County Scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install faster-whisper pydub requests anthropic pillow

      - name: Run scanner pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          BROADCASTIFY_USERNAME: ${{ secrets.BROADCASTIFY_USERNAME }}
          BROADCASTIFY_PASSWORD: ${{ secrets.BROADCASTIFY_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python scanner.py

      - name: Commit and push new site content
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/ state/
          git diff --staged --quiet || git commit -m "New incidents $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push

      - name: Commit and push new site content
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/ state/
          git diff --staged --quiet || git commit -m "New incidents $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
