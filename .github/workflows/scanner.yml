name: Bay County Scanner

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libavfilter-dev libswscale-dev libswresample-dev
          # Main pipeline deps
          pip install faster-whisper pydub requests anthropic pillow
          # broadcastify-cli pins old requests/click/openai versions that would drag
          # faster-whisper back to a release needing a source build of `av`, so it goes
          # in its own isolated environment via pipx instead. The apt dev headers above
          # are what let that older `av` actually compile.
          pip install pipx
          pipx install broadcastify-cli
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run scanner pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          BROADCASTIFY_USERNAME: ${{ secrets.BROADCASTIFY_USERNAME }}
          BROADCASTIFY_PASSWORD: ${{ secrets.BROADCASTIFY_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          # broadcastify-cli reads credentials from a .env file in the working dir
          printf 'USERNAME="%s"\nPASSWORD="%s"\n' "$BROADCASTIFY_USERNAME" "$BROADCASTIFY_PASSWORD" > .env
          python scanner.py
          rm -f .env

      - name: Commit and push new site content
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/ state/
          git diff --staged --quiet || git commit -m "New incidents $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
